[package]
name = "twig"
version = "2.0.0-alpha01"
authors = ["IDivisionTeam", "idivision.developer@gmail.com"]
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["cargo", "color", "derive"] }
config = { version = "0.15.11", features = ["toml"] }
serde = { version = "1.0.219", features = ["derive", "alloc"] }
serde_json = "1.0.141"
reqwest = { version = "0.12.22", features = ["json", "blocking"] }
base64 = "0.22.1"
anyhow = "1.0.100"
